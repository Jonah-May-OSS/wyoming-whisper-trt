[build-system]
requires = ["setuptools>=82.0.1", "wheel", "setuptools_scm[toml]>=10.0.5"]
build-backend = "setuptools.build_meta"

[project]
name = "wyoming-whisper-trt"
description = "Wyoming Server for Whisper powered by TensorRT"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Jonah May", email = "jonah@mayfamily.me"}
]
keywords = ["rhasspy", "wyoming", "whisper", "stt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Linguistic",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/Jonah-May-OSS/wyoming-whisper-trt"

[project.scripts]
wyoming-whisper-trt = "wyoming_whisper_trt.__main__:run"

[tool.setuptools.dynamic]
version = {file = "wyoming_whisper_trt/VERSION"}

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "asyncio: mark test as an asyncio test",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "torch2trt",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "Q",      # flake8-quotes
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "PLR0913", # Too many arguments to function call
    "PLR2004", # Magic value used in comparison
    "N802",    # Function name should be lowercase
    "N803",    # Argument name should be lowercase
    "N806",    # Variable in function should be lowercase
    "ARG002",  # Unused method argument
    "PTH",     # flake8-use-pathlib (gradual migration)
    "C901",    # Function is too complex (gradual improvement)
    "SIM115",  # Use context manager for opening files (gradual improvement)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR2004", "ARG", "PTH"]
"examples/*" = ["D", "ARG"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty.src]
# Wider than the include pyright used, which was the two packages: tests had
# never been type checked by anything. Adding them reported seven findings,
# none of them noise.
include = ["wyoming_whisper_trt", "whisper_trt", "tests"]
exclude = ["torch2trt", "**/__pycache__"]

[tool.ty.environment]
# Matches the version CI installs and runs the suite on. Note this is ahead of
# both requires-python (>=3.12) and the runtime image, which is pinned to
# python3.12 by its Ubuntu 24.04 base -- so 3.13+ stdlib and syntax pass
# analysis here that the shipped container could not run. Deliberate: the
# fix for that is to move the image, not to check against a version nothing
# develops on.
python-version = "3.14"
