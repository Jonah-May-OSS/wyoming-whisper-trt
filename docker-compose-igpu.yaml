services:
  wyoming-whisper-trt:
    image: captnspdr/wyoming-whisper-trt:latest-igpu
    container_name: wyoming-whisper-trt
    restart: unless-stopped
    environment:
      MODEL:      "${MODEL:-base}"
      LANGUAGE:   "${LANGUAGE:-auto}"
      URI:        "${URI:-tcp://0.0.0.0:10300}"
      DATA_DIR:   "${DATA_DIR:-/data}"
      COMPUTE_TYPE: "${COMPUTE_TYPE:-float16}"
      DECODER_MODE: "${DECODER_MODE:-kv}"
      NVIDIA_VISIBLE_DEVICES:     all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # Required on Jetson. run.sh keys its first-run setup off this: without it
      # setup installs the x86 torch/TensorRT pins from requirements.txt over
      # JetPack's own builds and the container fails to start.
      NVIDIA_EMBEDDED: "true"
    network_mode: host
    runtime: nvidia
